<!-- A reference to a quote, decoded before the code is read; Angular's has its `;` -->
<p>{{ '&quot;' }} {{ "&apos;" }} {{ '&#34;' }} {{ '&#x27;' }} {{ '&QUOT;' }}</p>
<!-- None: no `;`, another character, none at all -->
<p>{{ '&quot' }} {{ '&#39' }} {{ '&times;' }} {{ a &amp;&amp; b }} {{ a }}</p>
