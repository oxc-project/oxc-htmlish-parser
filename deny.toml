# Dependency checks adapted from oxc-toml, including benchmark features.
[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.8
# criterion2 and CodSpeed use colored for terminal output in development tools.
exceptions = [{ crate = "colored", allow = ["MPL-2.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
