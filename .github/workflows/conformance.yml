name: Conformance

permissions: {}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "crates/oxc_htmlish_parser/src/**"
      - "crates/oxc_htmlish_parser/tests/check/**"
      - "tasks/sig/**"
      - "tasks/conformance/**"
      - "tasks/differential/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/conformance.yml"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - "crates/oxc_htmlish_parser/src/**"
      - "crates/oxc_htmlish_parser/tests/check/**"
      - "tasks/sig/**"
      - "tasks/conformance/**"
      - "tasks/differential/**"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/conformance.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12 # v1.0.17
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tasks/differential/package-lock.json
      - name: Install the oracles
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tasks/differential
      - name: Check corpus snapshots
        run: node tasks/conformance/run.ts --check
